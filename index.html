<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oil App - Login</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 10px 20px; background: #ff6600; color: white; border: none; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <input id="email" placeholder="Email" type="email" />
  <input id="password" placeholder="Password" type="password" />
  <button onclick="login()">Login</button>
  <p id="msg"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB7Y4YLhqB0XRJxdcdAILmx9YaUoO6bMXc",
      authDomain: "oil-distribution-app-bed1f.firebaseapp.com",
      projectId: "oil-distribution-app-bed1f",
      storageBucket: "oil-distribution-app-bed1f.firebasestorage.app",
      messagingSenderId: "359461483648",
      appId: "1:359461483648:web:38ef78f1a16bf14622a265"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      try {
        const res = await signInWithEmailAndPassword(auth, email, password);
        const uid = res.user.uid;
        const userSnap = await getDoc(doc(db, "users", uid));
        if (!userSnap.exists()) {
          msg.innerText = "No role assigned. Contact admin.";
          return;
        }
        const role = userSnap.data().role;
        window.location.href = role + ".html";
      } catch (err) {
        msg.innerText = "Error: " + err.message;
      }
    };
  </script>
</body>
</html>
